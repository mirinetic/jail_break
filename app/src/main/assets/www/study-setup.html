<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>사용자 평가 연결</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0b0d14; color: #eef1f8; font-family: -apple-system, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; padding: max(20px, env(safe-area-inset-top)) 18px 24px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: #8b93a7; font-size: 14px; line-height: 1.55; margin: 0 0 16px; }
  label { display: block; font-size: 13px; color: #8b93a7; margin: 14px 0 6px; }
  input { width: 100%; font: inherit; font-size: 16px; padding: 13px; border-radius: 12px; border: 1px solid #262b3b; background: #0f1320; color: #fff; }
  button { width: 100%; margin-top: 18px; height: 50px; border: 0; border-radius: 12px; background: #f59e0b; color: #1c1917; font: inherit; font-size: 16px; font-weight: 700; }
  button:disabled { opacity: .4; }
  .card { background: #161a26; border: 1px solid #262b3b; border-radius: 16px; padding: 14px; margin-top: 16px; font-size: 14px; line-height: 1.6; }
  .ok { color: #34d399; } .bad { color: #fb7185; }
</style>
</head>
<body>
  <h1>사용자 평가 · 평가 서버 연결</h1>
  <p>Cove에서 사용자 평가를 하려면 평가 서버(TV Home과 같은 서버)에 한 번 연결해요. 주소와 업로드 키는 이 TV에만 저장되고, Cove 앱 코드에는 들어가지 않아요.</p>
  <div class="card" id="now">확인하는 중…</div>
  <label>평가 서버 주소</label>
  <input id="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://tvhome-study.….workers.dev">
  <label>업로드 키 (TV Home 다운로드 비밀번호와 같아요)</label>
  <input id="key" type="password" autocomplete="off" placeholder="••••••">
  <button id="go">연결하기</button>
  <div class="card" id="msg" hidden></div>
<script>
(function () {
  var t = new URLSearchParams(location.search).get('t') || '';
  var $ = function (id) { return document.getElementById(id); };
  function status() {
    fetch('/api/study/setup?t=' + encodeURIComponent(t), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
      $('now').innerHTML = s.configured
        ? '<span class="ok">● 연결돼 있어요</span><br>' + s.url.replace(/[<>&"]/g, '') + '<br>평가 키트: ' + (s.kit || '받는 중…') + '<br><span style="color:#8b93a7">다시 넣으면 바뀌어요</span>'
        : '<span class="bad">● 아직 연결되지 않았어요</span>';
      if (s.url && !$('url').value) $('url').value = s.url;
    }).catch(function () { $('now').innerHTML = '<span class="bad">TV와 연결할 수 없어요. 같은 와이파이인지 확인해 주세요.</span>'; });
  }
  $('go').onclick = function () {
    var b = $('go'); b.disabled = true; b.textContent = '확인하는 중…';
    fetch('/api/study/setup?t=' + encodeURIComponent(t), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: $('url').value.trim(), key: $('key').value }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { $('msg').hidden = false; $('msg').innerHTML = '<span class="' + (j.ok ? 'ok' : 'bad') + '">' + (j.message || '') + '</span>' + (j.ok ? '<br>TV가 평가 키트를 받는 중이에요. 잠시 뒤 TV 설정 → 사용자 평가 → 평가 모드 시작.' : ''); if (j.ok) $('key').value = ''; status(); })
      .catch(function () { $('msg').hidden = false; $('msg').innerHTML = '<span class="bad">TV와 연결할 수 없어요</span>'; })
      .then(function () { b.disabled = false; b.textContent = '연결하기'; });
  };
  status();
})();
</script>
</body>
</html>
