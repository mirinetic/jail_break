<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1118">
<title>Cove 리모컨</title>
<style>
  :root { --bg:#0e1118; --pad:#191e2a; --key:#232a3a; --key-on:#33405a; --ink:#eef1f7; --dim:#8d96aa; --accent:#9cc2ff; color-scheme:dark; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, "Apple SD Gothic Neo", "Noto Sans KR", Roboto, sans-serif; }
  body { padding:max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
         min-height:100vh; display:flex; flex-direction:column; gap:22px; max-width:460px; margin:0 auto; user-select:none; -webkit-user-select:none; }
  header { display:flex; justify-content:space-between; align-items:center; }
  header b { font-size:20px; letter-spacing:.02em; }
  header span { font-size:13px; color:var(--dim); display:flex; align-items:center; gap:6px; }
  header i { width:8px; height:8px; border-radius:50%; background:#5fd39a; display:inline-block; }
  header.off i { background:#f08a8a; }
  button { font:inherit; color:inherit; border:0; background:var(--key); border-radius:16px; padding:14px 10px; touch-action:manipulation; transition:background .1s, transform .1s; }
  button:active, button.on { background:var(--key-on); transform:scale(.97); }
  .pad { position:relative; width:min(78vw, 320px); aspect-ratio:1; margin:6px auto 0; border-radius:50%; background:var(--pad); }
  .pad button { position:absolute; background:transparent; border-radius:50%; width:34%; height:34%; font-size:26px; color:var(--dim); }
  .pad button:active { background:rgba(255,255,255,.06); }
  .pad .up { top:2%; left:33%; } .pad .down { bottom:2%; left:33%; } .pad .left { left:2%; top:33%; } .pad .right { right:2%; top:33%; }
  .pad .ok { left:30%; top:30%; width:40%; height:40%; background:var(--key); color:var(--ink); font-size:18px; font-weight:600; }
  .row { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .row.two { grid-template-columns:1fr 1fr; }
  h2 { margin:8px 0 -8px; font-size:13px; font-weight:600; color:var(--dim); letter-spacing:.08em; }
  .wide { width:100%; background:var(--accent); color:#0c1220; font-weight:600; }
  .note { font-size:13px; color:var(--dim); line-height:1.5; margin:0; }
  #msg { position:fixed; left:50%; bottom:max(24px, env(safe-area-inset-bottom)); transform:translateX(-50%); background:#222a3b; padding:10px 16px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #msg.on { opacity:1; }
  .pairing { margin:auto 0; text-align:center; display:grid; gap:10px; }
  .pairing b { font-size:20px; }
  .say { display:grid; grid-template-columns:1fr auto; gap:8px; }
  .say input { font:inherit; font-size:16px; color:var(--ink); background:var(--pad); border:1px solid #2c3446; border-radius:14px; padding:14px; min-width:0; }
  .say button { background:var(--accent); color:#0c1220; font-weight:600; padding:14px 18px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips button { padding:10px 14px; border-radius:20px; display:flex; align-items:center; gap:8px; }
  .chips i { width:12px; height:12px; border-radius:50%; display:inline-block; }
  .chips button.cur { outline:2px solid var(--accent); }
  .eg { font-size:12px; color:var(--dim); line-height:1.6; margin:0; }
</style>
</head>
<body>
<header id="head"><b>Cove</b><span><i></i><em id="status" style="font-style:normal">TV에 연결됨</em></span></header>

<div id="main">
  <div class="say">
    <input id="sayText" type="text" enterkeyhint="send" autocomplete="off" placeholder="말하거나 입력하기 (키보드의 마이크 버튼)">
    <button id="sayBtn">보내기</button>
  </div>
  <p class="eg" style="margin-top:8px">예: "넷플릭스 틀어줘", "미니멀로 바꿔", "배경 다음", "엄마 프로필", "유튜브 홈에서 빼줘"</p>

  <div class="pad" style="margin-top:18px">
    <button class="up" data-key="up" aria-label="위">▲</button>
    <button class="left" data-key="left" aria-label="왼쪽">◀</button>
    <button class="ok" data-key="ok" aria-label="OK, 길게 누르면 메뉴">OK</button>
    <button class="right" data-key="right" aria-label="오른쪽">▶</button>
    <button class="down" data-key="down" aria-label="아래">▼</button>
  </div>
  <p class="eg" style="text-align:center;margin-top:8px">OK를 길게 누르면 앱 메뉴(홈에서 빼기, 옮기기, 삭제)가 열려요</p>
  <div class="row" style="margin-top:14px">
    <button data-key="back">뒤로</button>
    <button data-cmd="home">홈</button>
    <button data-cmd="panel:drawer">모든 앱</button>
  </div>
  <div class="row two" style="margin-top:10px">
    <button data-cmd="panel:look">꾸미기</button>
    <button data-cmd="panel:settings">설정</button>
  </div>

  <h2>프로필</h2>
  <div class="chips" id="profiles" style="margin-top:18px"><span class="eg">불러오는 중…</span></div>

  <h2>디자인</h2>
  <div class="row" style="margin-top:18px">
    <button data-cmd="design:glass">Glass</button>
    <button data-cmd="design:icons">Icons</button>
    <button data-cmd="design:minimal">Minimal</button>
  </div>

  <h2>배경</h2>
  <div class="row two" style="margin-top:18px">
    <button data-cmd="bg:prev">◀ 이전 배경</button>
    <button data-cmd="bg:next">다음 배경 ▶</button>
  </div>
  <div style="margin-top:10px; display:grid">
    <button data-cmd="tiles:next">타일 스타일 바꾸기</button>
  </div>

  <h2>내 사진</h2>
  <div style="margin-top:18px; display:grid; gap:10px">
    <button class="wide" id="pick">폰 사진을 TV 배경으로</button>
    <input id="file" type="file" accept="image/*" hidden>
    <p class="note">사진은 TV 안에만 저장되고 인터넷으로 나가지 않아요.</p>
  </div>
</div>

<div id="pairing" class="pairing" hidden>
  <b>TV와 다시 연결해 주세요</b>
  <p class="note">TV에서 설정을 열고 화면의 QR 코드를 폰 카메라로 찍으면 리모컨이 연결돼요.</p>
</div>

<div id="msg"></div>
<script>
(function () {
  var token = new URLSearchParams(location.search).get('t') || '';
  var $ = function (id) { return document.getElementById(id); };
  var msgTimer;
  function msg(t) { var m = $('msg'); m.textContent = t; m.classList.add('on'); clearTimeout(msgTimer); msgTimer = setTimeout(function () { m.classList.remove('on'); }, 1800); }
  function state(ok) { $('head').classList.toggle('off', !ok); $('status').textContent = ok ? 'TV에 연결됨' : '연결 끊김'; }
  function paired(ok) { $('main').hidden = !ok; $('pairing').hidden = ok; }
  function post(path, body) {
    var sep = path.indexOf('?') < 0 ? '?' : '&';
    return fetch(path + sep + 't=' + encodeURIComponent(token), { method: 'POST', body: body || '' })
      .then(function (r) { state(true); if (r.status === 403) paired(false); return r; })
      .catch(function () { state(false); msg('TV에 연결할 수 없어요. 같은 와이파이인지 확인해 주세요.'); });
  }
  function buzz() { if (navigator.vibrate) navigator.vibrate(12); }

  // Arrow keys repeat while held, like a real remote.
  var repeatTimer = null, repeatDelay = null;
  function stopRepeat() { clearTimeout(repeatDelay); clearInterval(repeatTimer); }
  var okTimer = null, okLong = false;
  Array.prototype.forEach.call(document.querySelectorAll('[data-key]'), function (b) {
    var k = b.getAttribute('data-key');
    var arrow = ['up', 'down', 'left', 'right'].indexOf(k) >= 0;
    if (k === 'ok') {
      // OK fires on release; holding it ~0.5s sends "longok" (the app menu), like the TV remote.
      b.addEventListener('pointerdown', function (e) {
        e.preventDefault(); buzz(); okLong = false;
        okTimer = setTimeout(function () { okLong = true; buzz(); post('/api/key?k=longok'); }, 520);
      });
      b.addEventListener('pointerup', function () { clearTimeout(okTimer); if (!okLong) post('/api/key?k=ok'); okLong = true; });
      ['pointerleave', 'pointercancel'].forEach(function (ev) { b.addEventListener(ev, function () { clearTimeout(okTimer); okLong = true; }); });
      return;
    }
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault(); buzz(); post('/api/key?k=' + k);
      if (arrow) { stopRepeat(); repeatDelay = setTimeout(function () { repeatTimer = setInterval(function () { post('/api/key?k=' + k); }, 140); }, 420); }
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { b.addEventListener(ev, stopRepeat); });
  });
  function bindCmd(b) {
    b.addEventListener('click', function () { buzz(); post('/api/cmd?c=' + encodeURIComponent(b.getAttribute('data-cmd'))).then(function () { setTimeout(loadState, 400); }); });
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-cmd]'), bindCmd);

  // Voice or typed commands. The phone keyboard's microphone turns speech into text; the TV understands the text.
  function sendSay() {
    var t = $('sayText').value.trim();
    if (!t) return;
    buzz();
    post('/api/say', t).then(function (r) { if (r && r.ok) { msg('보냈어요: ' + t); $('sayText').value = ''; setTimeout(loadState, 500); } });
  }
  $('sayBtn').addEventListener('click', sendSay);
  $('sayText').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); sendSay(); } });

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function loadState() {
    if (!token) return;
    fetch('/api/state?t=' + encodeURIComponent(token)).then(function (r) {
      state(true); paired(r.status !== 403);
      return r.ok ? r.json() : null;
    }).then(function (root) {
      if (!root || !Array.isArray(root.profiles)) { $('profiles').innerHTML = '<span class="eg">TV에서 프로필을 만들면 여기에 나타나요</span>'; return; }
      $('profiles').innerHTML = root.profiles.map(function (p) {
        return '<button data-cmd="profile:' + esc(p.id) + '" class="' + (p.id === root.current ? 'cur' : '') + '"><i style="background:' + esc(p.color) + '"></i>' + esc(p.name) + '</button>';
      }).join('');
      Array.prototype.forEach.call($('profiles').querySelectorAll('[data-cmd]'), bindCmd);
    }).catch(function () { state(false); });
  }

  $('pick').addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    if (f.size > 25 * 1024 * 1024) { msg('25MB보다 작은 사진을 골라 주세요'); return; }
    msg('사진 보내는 중…');
    post('/api/photo', f).then(function (r) {
      if (!r) return;
      if (r.ok) msg('TV 배경으로 설정했어요');
      else if (r.status === 400) msg('이 사진 형식은 TV에서 열 수 없어요. JPG나 PNG로 보내 주세요.');
      else if (r.status !== 403) msg('사진을 보내지 못했어요');
    });
    this.value = '';
  });

  if (!token) paired(false);
  else loadState();
})();
</script>
</body>
</html>
