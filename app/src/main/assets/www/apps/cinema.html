<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cove 시네마</title>
<style>
  html { font-size: calc(100vw / 96); background: #07080d; }
  body { margin: 0; height: 100vh; overflow: hidden; color: #f4f5f8; background: #07080d; cursor: none;
    font-family: "Roboto", "Noto Sans CJK KR", "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  .brand { position: absolute; top: 2rem; left: 3.2rem; z-index: 3; font-weight: 800; font-size: 1.5rem; letter-spacing: .02em; }
  .brand b { color: #f472b6; }
  .brand small { margin-left: .9rem; font-weight: 500; font-size: 1rem; opacity: .65; }

  /* browse */
  #hero { position: absolute; inset: 0 0 auto 0; height: 58vh; overflow: hidden; }
  #heroArt { position: absolute; inset: 0; background-size: cover; background-position: center 30%; transition: opacity .35s; }
  #hero::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(7,8,13,.95) 0%, rgba(7,8,13,.6) 38%, rgba(7,8,13,0) 70%), linear-gradient(0deg, #07080d 0%, rgba(7,8,13,0) 45%); }
  .h-text { position: absolute; left: 3.2rem; bottom: 4.2rem; width: 38rem; z-index: 2; }
  .h-text h1 { margin: 0 0 .6rem; font-size: 3.4rem; line-height: 1.1; letter-spacing: -.02em; }
  .meta { display: flex; gap: .7rem; align-items: center; font-size: 1.05rem; opacity: .85; flex-wrap: wrap; }
  .rate { display: inline-grid; place-items: center; min-width: 1.9rem; height: 1.6rem; padding: 0 .35rem; border-radius: .35rem; font-size: .9rem; font-weight: 800; color: #111; }
  .rate.r0 { background: #4ade80; } .rate.r12 { background: #facc15; } .rate.r15 { background: #fb923c; }
  .h-text p { margin: .8rem 0 0; font-size: 1.2rem; line-height: 1.5; opacity: .85; }
  .prog { height: .3rem; border-radius: .2rem; background: rgba(255,255,255,.2); overflow: hidden; }
  .prog i { display: block; height: 100%; background: #f472b6; }
  .h-text .prog { width: 18rem; margin-top: 1rem; }

  #rows { position: absolute; left: 0; right: 0; top: 52vh; bottom: 0; overflow: hidden; }
  #rowsIn { transition: transform .3s cubic-bezier(.2,.7,.2,1); }
  .row { padding: 0 0 1.2rem; }
  .row h3 { margin: 0 0 .6rem 3.2rem; font-size: 1.3rem; font-weight: 600; opacity: .9; }
  .strip { display: flex; gap: 1.1rem; padding: .6rem 3.2rem; transition: transform .3s cubic-bezier(.2,.7,.2,1); }
  .poster { flex: 0 0 9.6rem; height: 14.4rem; border-radius: .8rem; background-size: cover; background-position: center; position: relative;
    box-shadow: 0 .5rem 1.4rem rgba(0,0,0,.45); transition: transform .2s, outline-color .2s; outline: .22rem solid transparent; outline-offset: .25rem; }
  .poster .prog { position: absolute; left: .7rem; right: .7rem; bottom: .7rem; }
  .poster.focus { transform: scale(1.08); outline-color: #fff; }
  .row:not(.cur) .poster.focus { transform: none; outline-color: transparent; }

  /* detail */
  #detail { position: absolute; inset: 0; z-index: 4; background: #07080d; }
  #dArt { position: absolute; inset: 0; background-size: cover; background-position: center; }
  #detail::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,8,13,.97) 0%, rgba(7,8,13,.75) 45%, rgba(7,8,13,.1) 100%); }
  .d-text { position: absolute; left: 4rem; top: 50%; transform: translateY(-50%); width: 44rem; z-index: 2; }
  .d-text h1 { margin: 0 0 .9rem; font-size: 4rem; letter-spacing: -.02em; line-height: 1.1; }
  .d-text p { font-size: 1.3rem; line-height: 1.6; opacity: .88; margin: 1.2rem 0 2rem; }
  .btns { display: flex; gap: 1rem; flex-wrap: wrap; }
  .btn { padding: .9rem 1.7rem; border-radius: .7rem; font-size: 1.2rem; font-weight: 600; background: rgba(255,255,255,.14); outline: .2rem solid transparent; outline-offset: .2rem; }
  .btn.focus { background: #fff; color: #111; outline-color: rgba(255,255,255,.5); }
  .d-text .prog { width: 22rem; margin: -1rem 0 1.6rem; }
  .d-text small { display: block; margin-bottom: 1.6rem; font-size: 1rem; opacity: .7; }

  /* player */
  #player { position: absolute; inset: 0; z-index: 6; background: #000; }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sub { position: absolute; left: 0; right: 0; bottom: 12%; text-align: center; font-size: 1.8rem; font-weight: 600; text-shadow: 0 .15rem .5rem #000, 0 0 .2rem #000; transition: opacity .4s; }
  .osd { position: absolute; left: 0; right: 0; bottom: 0; padding: 4rem 3.2rem 2.4rem; background: linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,0)); transition: opacity .3s; }
  .osd h2 { margin: 0 0 1rem; font-size: 1.8rem; }
  .bar { display: flex; align-items: center; gap: 1.2rem; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .bar .prog { flex: 1; height: .45rem; }
  .keys { margin-top: 1rem; display: flex; gap: 1.6rem; font-size: 1rem; opacity: .75; }
  .keys kbd { font: inherit; font-weight: 700; padding: .1rem .5rem; border-radius: .3rem; background: rgba(255,255,255,.18); margin-right: .4rem; }
  .big { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); width: 7rem; height: 7rem; border-radius: 50%; background: rgba(0,0,0,.55); display: grid; place-items: center; }
  .big svg { width: 3rem; height: 3rem; fill: #fff; }
  .seek { position: absolute; top: 45%; transform: translateY(-50%); font-size: 1.6rem; font-weight: 700; padding: .8rem 1.3rem; border-radius: 2rem; background: rgba(0,0,0,.55); opacity: 0; transition: opacity .3s; }
  .seek.on { opacity: 1; }
  .fake { position: absolute; top: 1.6rem; right: 2rem; font-size: .9rem; opacity: .55; }
  .hide { opacity: 0; }
  #empty { position: absolute; left: 3.2rem; top: 60vh; font-size: 1.3rem; opacity: .7; }
</style>
</head>
<body>
  <div class="brand">COVE <b>시네마</b><small id="who"></small></div>
  <section id="browse">
    <div id="hero"><div id="heroArt"></div>
      <div class="h-text"><h1 id="hTitle"></h1><div class="meta" id="hMeta"></div><div class="prog" id="hProg" hidden><i></i></div><p id="hDesc"></p></div>
    </div>
    <div id="rows"><div id="rowsIn"></div></div>
    <p id="empty" hidden>볼 수 있는 작품이 없어요.</p>
  </section>
  <section id="detail" hidden>
    <div id="dArt"></div>
    <div class="d-text"><h1 id="dTitle"></h1><div class="meta" id="dMeta"></div><p id="dDesc"></p><div class="prog" id="dProg" hidden><i></i></div><small id="dNote"></small><div class="btns" id="dBtns"></div></div>
  </section>
  <section id="player" hidden>
    <canvas id="screen"></canvas>
    <div class="fake">Cove 시네마의 연습용 가상 영상이에요</div>
    <div class="sub" id="sub"></div>
    <div class="big" id="big" hidden><svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></div>
    <div class="seek" id="seekL" style="left:18%">« 30초</div>
    <div class="seek" id="seekR" style="right:18%">30초 »</div>
    <div class="osd" id="osd"><h2 id="pTitle"></h2>
      <div class="bar"><span id="pNow">0:00</span><div class="prog"><i id="pBar"></i></div><span id="pDur">0:00</span></div>
      <div class="keys"><span><kbd>OK</kbd>일시정지 / 재생</span><span><kbd>◀ ▶</kbd>30초 이동</span><span><kbd>뒤로</kbd>그만 보기 (이어 보기로 저장)</span></div>
    </div>
  </section>

<script src="sdk.js"></script>
<script src="cinema-catalog.js"></script>

      case 'crown': o += '<path d="M' + W * .25 + ' ' + H * .55 + ' L' + W * .25 + ' ' + H * .32 + ' L' + W * .38 + ' ' + H * .44 + ' L' + W * .5 + ' ' + H * .26 + ' L' + W * .62 + ' ' + H * .44 + ' L' + W * .75 + ' ' + H * .32 + ' L' + W * .75 + ' ' + H * .55 + 'Z" fill="' + a + '"/><circle cx="' + W * .5 + '" cy="' + H * .47 + '" r="' + W * .03 + '" fill="#dc2626"/>'; break;

    if (name) for (var i = 0; i < rows.length; i++) if (rows[i].name === name) ri = i;
    $('empty').hidden = rows.length > 0;
    $('rowsIn').innerHTML = rows.map(function (r, i) {
      return '<div class="row" data-r="' + i + '"><h3>' + esc(r.name) + '</h3><div class="strip">' + r.items.map(function (t) {
        var h = hist(t.id), p = h && !h.done ? '<div class="prog"><i style="width:' + Math.round(100 * h.pos / h.dur) + '%"></i></div>' : '';
        return '<div class="poster" style="background-image:url(&quot;' + art(t) + '&quot;)">' + p + '</div>';
      }).join('') + '</div></div>';
    }).join('');
    showFocus();
  }
  function showFocus() {
    if (!rows.length) return;
    var els = document.querySelectorAll('.row');
    els.forEach(function (el, i) { el.classList.toggle('cur', i === ri); });
    var row = rows[ri], ci = Math.min(cols[row.name] || 0, row.items.length - 1);
    cols[row.name] = ci;
    document.querySelectorAll('.poster.focus').forEach(function (p) { p.classList.remove('focus'); });
    els.forEach(function (el, i) {
      var n = rows[i].name, c = Math.min(cols[n] || 0, rows[i].items.length - 1), strip = el.querySelector('.strip');
      var p = strip.children[c];
      if (p) p.classList.add('focus');
      var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
      strip.style.transform = 'translateX(' + (-Math.max(0, c - 2) * 10.7 * rem) + 'px)';
    });
    var target = els[ri];
    $('rowsIn').style.transform = 'translateY(' + (-target.offsetTop) + 'px)';
    cur = row.items[ci];
    $('heroArt').style.backgroundImage = 'url("' + art(cur, true) + '")';
    $('hTitle').textContent = cur.title;
    $('hMeta').innerHTML = rateHtml(cur) + '<span>' + cur.year + '</span><span>·</span><span>' + cur.genre + '</span><span>·</span><span>' + Math.floor(cur.mins / 60) + '시간 ' + (cur.mins % 60) + '분</span>';
    $('hDesc').textContent = cur.desc;
    var h = hist(cur.id);
    $('hProg').hidden = !(h && !h.done);
    if (h && !h.done) $('hProg').firstChild.style.width = Math.round(100 * h.pos / h.dur) + '%';
  }
  function browseKey(k) {
    if (k === 'back') { CoveApp.exit(); return; }
    if (!rows.length) return;
    var row = rows[ri];
    if (k === 'left') cols[row.name] = Math.max(0, (cols[row.name] || 0) - 1);
    else if (k === 'right') cols[row.name] = Math.min(row.items.length - 1, (cols[row.name] || 0) + 1);
    else if (k === 'up') ri = Math.max(0, ri - 1);
    else if (k === 'down') ri = Math.min(rows.length - 1, ri + 1);
    else if (k === 'ok') { openDetail(cur); return; }
    showFocus();
  }

  // ---------- detail ----------
  function detailBtns() {
    var h = hist(cur.id), b = [];
    if (h && !h.done) b.push(['resume', '▶ 이어 보기 ' + mmss(h.pos)], ['start', '처음부터']);
    else b.push(['start', '▶ 재생']);
    b.push(['fav', data.fav.indexOf(cur.id) >= 0 ? '✓ 찜함' : '+ 찜하기']);
    return b;
  }
  function openDetail(t) {
    cur = t; view = 'detail'; dBtn = 0;
    $('detail').hidden = false;
    renderDetail();
  }
  function renderDetail() {
    var t = cur, h = hist(t.id);
    $('dArt').style.backgroundImage = 'url("' + art(t, true) + '")';
    $('dTitle').textContent = t.title;
    $('dMeta').innerHTML = rateHtml(t) + '<span>' + t.year + '</span><span>·</span><span>' + t.genre + '</span><span>·</span><span>' + Math.floor(t.mins / 60) + '시간 ' + (t.mins % 60) + '분</span>';
    $('dDesc').textContent = t.desc;
    $('dProg').hidden = !(h && !h.done);
    if (h && !h.done) $('dProg').firstChild.style.width = Math.round(100 * h.pos / h.dur) + '%';
    $('dNote').textContent = h ? (h.done ? '끝까지 본 작품이에요' : '남은 시간 ' + mmss(h.dur - h.pos)) : '';
    var b = detailBtns();
    dBtn = Math.min(dBtn, b.length - 1);
    $('dBtns').innerHTML = b.map(function (x, i) { return '<div class="btn' + (i === dBtn ? ' focus' : '') + '">' + x[1] + '</div>'; }).join('');
  }
  function detailKey(k) {
    var b = detailBtns();
    if (k === 'back') { view = 'browse'; $('detail').hidden = true; renderBrowse(true); return; }
    if (k === 'left') dBtn = Math.max(0, dBtn - 1);
    else if (k === 'right') dBtn = Math.min(b.length - 1, dBtn + 1);
    else if (k === 'ok') {
      var a = b[dBtn][0];
      if (a === 'fav') {
        var i = data.fav.indexOf(cur.id);
        if (i >= 0) data.fav.splice(i, 1); else data.fav.unshift(cur.id);
        save();
      } else { startPlay(a === 'resume' ? hist(cur.id).pos : 0); return; }
    }
    renderDetail();
  }

  // ---------- the pretend player ----------
  var LINES = ['…', '여기가 맞는 것 같아.', '조금만 더 가 보자.', '들었어? 방금 그 소리.', '괜찮아, 내가 옆에 있을게.', '이건 처음 보는 길이야.',
    '그때도 이런 밤이었지.', '서두르지 않아도 돼.', '저 불빛 따라가면 될까?', '비밀로 해 줄 수 있어?', '와… 정말 예쁘다.', '내일 다시 오자.'];
  function startPlay(pos) {
    var t = cur;
    view = 'player';
    $('player').hidden = false;
    $('pTitle').textContent = t.title;
    var img = new Image();
    img.src = art(t, true);
    play = { t: t, pos: pos, dur: t.mins * 60, last: Date.now(), paused: false, img: img, osdUntil: Date.now() + 4000, saved: Date.now(), parts: [] };
    var r = rnd(t.id + 'p');
    for (var i = 0; i < 40; i++) play.parts.push({ x: r(), y: r(), s: r() * 2 + .6, v: r() * .02 + .005 });
    loop();
  }
  function stopPlay(done) {
    if (!play) return;
    var t = play.t, h = hist(t.id);
    if (!h) { h = { id: t.id }; data.hist.unshift(h); }
    else { data.hist.splice(data.hist.indexOf(h), 1); data.hist.unshift(h); }
    h.title = t.title; h.dur = play.dur; h.t = Date.now();
    h.done = !!done || play.pos >= play.dur - 60;
    h.pos = h.done ? 0 : Math.floor(play.pos);
    data.hist = data.hist.slice(0, 30);
    save();
    play = null;
    $('player').hidden = true;
    view = 'detail';
    renderDetail();
  }
  function playerKey(k) {
    if (k === 'back') { stopPlay(false); return; }
    play.osdUntil = Date.now() + 4000;
    if (k === 'ok') { play.paused = !play.paused; play.last = Date.now(); }
    else if (k === 'left' || k === 'right') {
      play.pos = Math.max(0, Math.min(play.dur - 1, play.pos + (k === 'left' ? -30 : 30)));
      var el = $(k === 'left' ? 'seekL' : 'seekR');
      el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('on'); }, 600);
    }
  }
  function loop() {
    if (!play) return;
    var now = Date.now();
    if (!play.paused) play.pos += Math.min(1, (now - play.last) / 1000);   // no jump after the TV slept
    play.last = now;
    if (play.pos >= play.dur) { stopPlay(true); return; }
    if (now - play.saved > 20000) { play.saved = now; var keep = play; stopPlayQuiet(keep); }
    var c = $('screen'), W = c.clientWidth, H = c.clientHeight;
    if (c.width !== W) { c.width = W; c.height = H; }
    var x = c.getContext('2d');
    x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
    // slow pan and zoom over the title's picture, so time visibly moves
    var z = 1.15 + .1 * Math.sin(play.pos / 23), ox = Math.sin(play.pos / 31) * W * .04, oy = Math.cos(play.pos / 37) * H * .03;
    if (play.img.complete) x.drawImage(play.img, (W - W * z) / 2 + ox, (H - H * z) / 2 + oy, W * z, H * z);
    x.fillStyle = 'rgba(255,255,255,.7)';
    play.parts.forEach(function (p) {
      var yy = ((p.y - play.pos * p.v) % 1 + 1) % 1;
      x.beginPath(); x.arc(p.x * W, yy * H, p.s * W / 960, 0, 7); x.fill();
    });
    var bh = H * .09; x.fillStyle = '#000'; x.fillRect(0, 0, W, bh); x.fillRect(0, H - bh, W, bh);
    var li = Math.floor(play.pos / 6);
    $('sub').textContent = li % 3 === 2 ? '' : LINES[(li * 7 + play.t.id.length) % LINES.length];
    var show = play.paused || now < play.osdUntil;
    $('osd').classList.toggle('hide', !show);
    $('big').hidden = !play.paused;
    $('pNow').textContent = mmss(play.pos); $('pDur').textContent = mmss(play.dur);
    $('pBar').style.width = (100 * play.pos / play.dur) + '%';
    requestAnimationFrame(loop);
  }
  // keep the place every 20 s, so switching the TV off mid-film still resumes close to where it stopped
  function stopPlayQuiet(p) {
    var h = hist(p.t.id);
    if (!h) { h = { id: p.t.id }; data.hist.unshift(h); }
    h.title = p.t.title; h.dur = p.dur; h.t = Date.now(); h.done = false; h.pos = Math.floor(p.pos);
    save();
  }

  CoveApp.onInit(function (profile, d, ex) {
    who = profile || who;
    data = d && typeof d === 'object' ? d : {};
    if (!Array.isArray(data.hist)) data.hist = [];
    if (!Array.isArray(data.fav)) data.fav = [];
    $('who').textContent = (who.name || '') + (who.kids ? ' · 키즈' : '');
    renderBrowse(false);
    // opened by voice from the home screen: "이어 보기", "찜한 거", or a title
    var it = (ex && ex.intent) || null, t = it && BYID[it.play];
    if (t) {
      if (!allowed(t)) { var c = t.title.charCodeAt(t.title.length - 1) - 0xAC00; CoveApp.toast('"' + t.title + '"' + (c >= 0 && c % 28 ? '은' : '는') + ' 키즈 프로필에서 볼 수 없는 작품이에요'); return; }
      var h = hist(t.id);
      openDetail(t);
      startPlay(it.resume && h && !h.done ? h.pos : 0);
    }
  });
  CoveApp.onKey(function (k) {
    if (view === 'player') playerKey(k);
    else if (view === 'detail') detailKey(k);
    else browseKey(k);
  });
})();
</script>
</body>
</html>
