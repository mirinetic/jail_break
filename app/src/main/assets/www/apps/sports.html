<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cove 스포츠</title>
<style>
  html { font-size: calc(100vw / 96); background: #070b16; }
  body { margin: 0; height: 100vh; overflow: hidden; color: #f3f5fa; cursor: none;
    background: radial-gradient(120% 70% at 80% -10%, #1b2a55 0%, #0a1020 55%, #070b16 100%);
    font-family: "Roboto", "Noto Sans CJK KR", "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  .dim { color: #94a0b8; }
  header { position: absolute; left: 3.4rem; right: 3.4rem; top: 2.2rem; display: flex; align-items: center; gap: 2rem; }
  header h1 { margin: 0; font-size: 2.1rem; font-weight: 800; letter-spacing: -.01em; }
  header h1 b { color: #34d399; }
  .tabs { display: flex; gap: .6rem; }
  .tab { padding: .6rem 1.3rem; border-radius: 2rem; background: rgba(255,255,255,.07); font-size: 1.1rem; color: #b8c2d8; }
  .tab.on { background: rgba(52,211,153,.18); color: #fff; box-shadow: inset 0 -.25rem 0 #34d399; }
  .tab.sel { background: #fff; color: #0b1222; box-shadow: none; }
  .clock { margin-left: auto; font-size: 1.2rem; color: #94a0b8; }

  .dates { position: absolute; left: 3.4rem; right: 34rem; top: 6.8rem; display: flex; gap: .6rem; }
  .date { flex: 1; text-align: center; padding: .6rem .3rem; border-radius: 1rem; background: rgba(255,255,255,.05); font-size: 1rem; color: #94a0b8; }
  .date b { display: block; font-size: 1.3rem; color: #e5e9f2; }
  .date.on { background: rgba(255,255,255,.13); color: #fff; }
  .date.sel { background: #fff; color: #0b1222; } .date.sel b { color: #0b1222; }
  .date.today b::after { content: " •"; color: #34d399; }

  .list { position: absolute; left: 3.4rem; right: 34rem; top: 12rem; bottom: 3.6rem; overflow: hidden; display: flex; flex-direction: column; gap: .8rem; padding: .4rem; }
  .match { display: grid; grid-template-columns: 7.6rem 1fr 7rem 1fr 9rem; align-items: center; gap: 1rem; padding: 1rem 1.4rem; border-radius: 1.3rem; background: rgba(255,255,255,.06); flex: none; border: .1rem solid transparent; }
  .match.live { border-color: rgba(239,68,68,.45); background: linear-gradient(90deg, rgba(239,68,68,.12), rgba(255,255,255,.05)); }
  .match.sel { outline: .22rem solid #fff; outline-offset: .2rem; background: rgba(255,255,255,.14); }
  .when { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .when small { display: block; font-size: .85rem; color: #94a0b8; }
  .team { display: flex; align-items: center; gap: .9rem; font-size: 1.25rem; font-weight: 600; min-width: 0; }
  .team.away { flex-direction: row-reverse; text-align: right; }
  .team span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team.lose span { opacity: .55; }
  .crest { width: 3rem; height: 3rem; flex: none; }
  .score { text-align: center; font-size: 2.1rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .score.vs { font-size: 1.2rem; color: #94a0b8; font-weight: 500; }
  .state { justify-self: end; font-size: .95rem; padding: .35rem .8rem; border-radius: 1rem; background: rgba(255,255,255,.08); color: #b8c2d8; white-space: nowrap; }
  .state.live { background: #ef4444; color: #fff; font-weight: 700; animation: blink 1.6s ease-in-out infinite; }
  .state.added { background: rgba(52,211,153,.2); color: #6ee7b7; }
  @keyframes blink { 50% { opacity: .65; } }
  .empty { margin: 3rem auto; font-size: 1.4rem; color: #94a0b8; }

  .side { position: absolute; right: 3.4rem; top: 6.8rem; bottom: 3.6rem; width: 28rem; display: flex; flex-direction: column; gap: 1.2rem; }
  .card { border-radius: 1.3rem; background: rgba(255,255,255,.06); padding: 1.1rem 1.3rem; }
  .card h3 { margin: 0 0 .7rem; font-size: 1.05rem; color: #94a0b8; font-weight: 600; letter-spacing: .04em; }
  table { width: 100%; border-collapse: collapse; font-size: 1rem; }
  td { padding: .32rem .2rem; } td.n { width: 1.6rem; color: #94a0b8; } td.r { text-align: right; font-variant-numeric: tabular-nums; } td.p { font-weight: 700; }
  td .crest { width: 1.6rem; height: 1.6rem; vertical-align: middle; margin-right: .5rem; }
  .news { display: grid; gap: .5rem; }
  .ni { padding: .7rem .8rem; border-radius: .9rem; font-size: 1.05rem; line-height: 1.4; }
  .ni small { display: block; font-size: .85rem; color: #94a0b8; margin-top: .2rem; }
  .ni.sel { background: #fff; color: #0b1222; } .ni.sel small { color: #475569; }
  .hint { position: absolute; left: 3.4rem; bottom: 1.3rem; display: flex; gap: 1.6rem; font-size: .95rem; color: #94a0b8; }
  .hint kbd { font: inherit; font-weight: 700; padding: .05rem .45rem; border-radius: .35rem; background: rgba(255,255,255,.16); color: #fff; margin-right: .35rem; }

  /* match page */
  #detail { position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% -10%, var(--c1, #1b2a55) 0%, #0a1020 60%, #070b16 100%); padding: 2.6rem 3.4rem 3.6rem; display: flex; flex-direction: column; gap: 1.6rem; }
  .board { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 3rem; padding: 1.4rem 2rem 1.6rem; border-radius: 1.6rem; background: rgba(0,0,0,.25); }
  .bteam { display: flex; flex-direction: column; align-items: center; gap: .6rem; font-size: 1.6rem; font-weight: 700; }
  .bteam .crest { width: 6.4rem; height: 6.4rem; }
  .bmid { text-align: center; }
  .bscore { font-size: 5.6rem; font-weight: 800; letter-spacing: .06em; line-height: 1; font-variant-numeric: tabular-nums; }
  .bmid .state { display: inline-block; margin-top: .8rem; font-size: 1.1rem; }
  .bmid .lg { font-size: 1rem; color: #94a0b8; margin-bottom: .6rem; }
  .dbody { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.2fr 1fr .9fr; gap: 1.6rem; }
  .tl { display: grid; gap: .45rem; font-size: 1.1rem; align-content: start; }
  .ev { display: grid; grid-template-columns: 3.6rem 1fr; gap: .8rem; padding: .45rem .6rem; border-radius: .7rem; background: rgba(255,255,255,.04); }
  .ev b { color: #fde68a; font-variant-numeric: tabular-nums; }
  .ev.away { text-align: right; grid-template-columns: 1fr 3.6rem; }
  .stat { display: grid; grid-template-columns: 3rem 1fr 3rem; gap: .8rem; align-items: center; font-size: 1.05rem; margin-bottom: .8rem; }
  .stat small { grid-column: 1 / 4; text-align: center; color: #94a0b8; font-size: .9rem; margin-bottom: -.4rem; }
  .bar { height: .5rem; border-radius: .3rem; background: rgba(255,255,255,.12); overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .stat span:last-child { text-align: right; }
  .acts { display: grid; gap: .7rem; align-content: start; }
  .act { padding: 1rem 1.2rem; border-radius: 1.1rem; background: rgba(255,255,255,.08); font-size: 1.15rem; font-weight: 600; }
  .act small { display: block; font-weight: 400; font-size: .9rem; color: #94a0b8; margin-top: .2rem; }
  .act.sel { background: #fff; color: #0b1222; } .act.sel small { color: #475569; }
  .act.live { background: rgba(239,68,68,.22); } .act.live.sel { background: #fff; }
  .inn { display: grid; grid-template-columns: 6rem repeat(9, 1fr) 2.6rem; gap: .2rem; font-size: 1rem; text-align: center; font-variant-numeric: tabular-nums; }
  .inn span { padding: .45rem 0; background: rgba(255,255,255,.05); border-radius: .3rem; }
  .inn .h { color: #94a0b8; background: none; }
  .inn .t { font-weight: 800; background: rgba(255,255,255,.12); }
  .inn .nm { text-align: left; padding-left: .5rem; }

  /* video */
  #video { position: absolute; inset: 0; background: #000; }
  #vcv { position: absolute; inset: 0; width: 100%; height: 100%; }
  .vbug { position: absolute; left: 2.4rem; top: 2rem; display: flex; align-items: stretch; border-radius: .7rem; overflow: hidden; font-weight: 700; font-size: 1.3rem; box-shadow: 0 .6rem 1.6rem rgba(0,0,0,.5); }
  .vbug span { padding: .5rem .9rem; background: #0b1222; } .vbug .sc { background: #fff; color: #0b1222; font-variant-numeric: tabular-nums; } .vbug .tm { background: #ef4444; }
  .vtag { position: absolute; right: 2.4rem; top: 2rem; padding: .5rem 1rem; border-radius: 2rem; font-weight: 700; background: rgba(0,0,0,.55); }
  .vtag.live { background: #ef4444; }
  .vcap { position: absolute; left: 50%; bottom: 4.6rem; transform: translateX(-50%); padding: .9rem 1.8rem; border-radius: 1rem; background: rgba(5,10,20,.78); font-size: 1.6rem; font-weight: 700; white-space: nowrap; transition: opacity .4s; }
  .vfake { position: absolute; right: 2.4rem; bottom: 1.6rem; font-size: .9rem; color: rgba(255,255,255,.55); }

  /* article */
  #article { position: absolute; inset: 0; background: rgba(4,7,14,.78); display: grid; place-items: center; }
  .art { width: min(70rem, 86vw); padding: 2.6rem 3rem; border-radius: 1.6rem; background: #0f1628; border: .08rem solid rgba(255,255,255,.1); box-shadow: 0 2rem 5rem rgba(0,0,0,.5); }
  .art .k { font-size: 1rem; font-weight: 800; color: #34d399; letter-spacing: .06em; }
  .art h2 { margin: .7rem 0 1rem; font-size: 2.4rem; line-height: 1.3; }
  .art p { font-size: 1.3rem; line-height: 1.75; color: #d6dbe7; margin: 0 0 .8rem; }
  .art .src { font-size: .95rem; color: #94a0b8; margin-top: 1.4rem; }
</style>
</head>
<body>
  <header><h1>Cove <b>스포츠</b></h1><div class="tabs" id="tabs"></div><div class="clock" id="clk"></div></header>
  <section id="home">
    <div class="dates" id="dates"></div>
    <div class="list" id="list"></div>
    <div class="side"><div class="card"><h3 id="stH">순위</h3><table id="table"></table></div><div class="card" style="flex:1;min-height:0;overflow:hidden"><h3>스포츠 뉴스</h3><div class="news" id="news"></div></div></div>
    <div class="hint"><span><kbd>◀ ▶</kbd>날짜 · 종목 (맨 위)</span><span><kbd>▲ ▼</kbd>경기</span><span><kbd>OK</kbd>경기 보기</span><span><kbd>뒤로</kbd>나가기</span></div>
  </section>
  <section id="detail" hidden></section>
  <section id="video" hidden><canvas id="vcv"></canvas><div class="vbug" id="vbug"></div><div class="vtag" id="vtag"></div><div class="vcap" id="vcap"></div><div class="vfake">Cove 스포츠의 가상 경기 화면이에요 · 뒤로 닫기</div></section>
  <section id="article" hidden><div class="art" id="art"></div></section>

<script src="sdk.js"></script>
<script>
(function () {
  'use strict';
  // Everything here is invented for Cove: leagues, teams, players, matches and news. The schedule is made
  // from the date, so every TV shows the same games, and live games follow the real clock.
  var $ = function (id) { return document.getElementById(id); };
  var MIN = 60000, DAY = 86400000;
  function h32(s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
  function rnd(s) { return (h32(s) % 100003) / 100003; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  var LEAGUES = {
    soccer: { name: '축구 · 코브 리그', short: '코브 리그', len: 45, slots: [[13, 0], [16, 0], [19, 0], [21, 0]], teams: [
      ['gal', '은하 유나이티드', '#1d4ed8', '#93c5fd'], ['wind', '바람 시티', '#0ea5e9', '#e0f2fe'], ['sun', '햇살 FC', '#f59e0b', '#7c2d12'], ['wave', '파도 원더러스', '#0891b2', '#cffafe'],
      ['star', '북극성 FC', '#4338ca', '#fde68a'], ['moon', '달빛 레인저스', '#7c3aed', '#ede9fe'], ['pine', '소나무 SC', '#15803d', '#dcfce7'], ['fire', '불꽃 유나이티드', '#dc2626', '#fee2e2']] },
    baseball: { name: '야구 · 코브 베이스볼', short: '코브 베이스볼', len: 120, slots: [[12, 30], [17, 30], [20, 30]], teams: [
      ['owl', '부엉이즈', '#1e3a8a', '#fbbf24'], ['fox', '여우스', '#ea580c', '#fff7ed'], ['whale', '고래스', '#0369a1', '#e0f2fe'], ['crane', '두루미스', '#0f766e', '#f0fdfa'],
      ['comet', '혜성스', '#9333ea', '#faf5ff'], ['otter', '수달스', '#78350f', '#fde68a']] }
  };
  var TEAM = {};
  Object.keys(LEAGUES).forEach(function (lg) { LEAGUES[lg].teams.forEach(function (t) { TEAM[t[0]] = { id: t[0], name: t[1], c1: t[2], c2: t[3], lg: lg, str: 0.75 + rnd('str' + t[0]) * 0.6 }; }); });
  var SUR = '김이박최정강조윤장임한오서신권황안송류홍', GIV = ['하늘', '바다', '서준', '도윤', '민재', '태양', '지호', '준서', '우진', '현우', '건우', '시우', '예준', '주원', '은호', '하준', '로운', '산', '별', '결'];
  function player(team, i) { return SUR.charAt(h32(team + 's' + i) % SUR.length) + GIV[h32(team + 'g' + i) % GIV.length]; }
  function crest(t, cls) {
    var T = TEAM[t];
    return '<svg class="crest ' + (cls || '') + '" viewBox="0 0 40 46"><path d="M20 2l17 6v14c0 11-7 18-17 22C10 40 3 33 3 22V8z" fill="' + T.c1 + '" stroke="' + T.c2 + '" stroke-width="2.4"/>' +
      '<path d="M3 20h34" stroke="' + T.c2 + '" stroke-width="2" opacity=".5"/><text x="20" y="31" text-anchor="middle" font-size="15" font-weight="800" fill="' + T.c2 + '" font-family="sans-serif">' + T.name.charAt(0) + '</text></svg>';
  }

  // ---------- time and schedule ----------
  var who = {}, data = {}, shift = 0;
  function nowMs() { return Date.now(); }
  function wall(t) { return new Date((t === undefined ? Date.now() : t) + shift * MIN); }   // local fields show Cove's time zone
  function dayStart(offset) { var d = wall(); d.setHours(0, 0, 0, 0); return d.getTime() + offset * DAY - shift * MIN; }   // real ms of that wall-day's midnight
  function keyOf(ms) { var d = wall(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function matchesOn(lg, offset) {
    var L = LEAGUES[lg], d0 = dayStart(offset), key = keyOf(d0 + 12 * 3600000), ids = L.teams.map(function (t) { return t[0]; });
    ids.sort(function (a, b) { return h32(key + a) - h32(key + b); });
    return L.slots.map(function (sl, i) {
      var home = ids[i * 2], away = ids[i * 2 + 1];
      return { id: lg + ':' + key + ':' + i, lg: lg, home: home, away: away, start: d0 + (sl[0] * 60 + sl[1]) * MIN, day: key, venue: TEAM[home].name.split(' ')[0] + ' 경기장' };
    });
  }
  // a match's events (all of them, decided by its id); live shows those that have happened
  var evCache = {};
  function events(m) {
    if (evCache[m.id]) return evCache[m.id];
    var out = [];
    if (m.lg === 'soccer') {
      [m.home, m.away].forEach(function (t, side) {
        var lam = TEAM[t].str * (side ? 1.1 : 1.35), n = 0, r = rnd(m.id + t + 'n');
        var cum = 0, p = Math.exp(-lam), f = p; while (r > f && n < 6) { n++; p = p * lam / n; f += p; }
        for (var i = 0; i < n; i++) out.push({ min: 1 + Math.floor(rnd(m.id + t + 'm' + i) * 90), side: side, kind: 'goal', who: player(t, 1 + h32(m.id + t + 'p' + i) % 10) });
        if (rnd(m.id + t + 'y') < 0.6) out.push({ min: 10 + Math.floor(rnd(m.id + t + 'ym') * 80), side: side, kind: 'card', who: player(t, 2 + h32(m.id + t + 'yp') % 9) });
      });
      out.sort(function (a, b) { return a.min - b.min; });
    } else {
      [m.home, m.away].forEach(function (t, side) {
        for (var inn = 1; inn <= 9; inn++) {
          var r = rnd(m.id + t + 'i' + inn), r2 = rnd(m.id + t + 'j' + inn), runs = r < 0.2 * TEAM[t].str ? 1 + (r2 < 0.3 ? 1 : 0) + (r2 < 0.08 ? 1 : 0) : 0;
          if (runs) out.push({ inn: inn, side: side, runs: runs, kind: 'run', who: player(t, 1 + h32(m.id + t + 'b' + inn) % 9), hr: rnd(m.id + t + 'hr' + inn) < 0.3 });
        }
      });
      out.sort(function (a, b) { return a.inn - b.inn || a.side - b.side; });
    }
    return (evCache[m.id] = out);
  }
  // game clock: football is 2 x 20 minutes with 5 minutes between (shown as 1'-90'); baseball runs 9 innings in 2 hours
  function stateOf(m, t) {
    var L = LEAGUES[m.lg], el = ((t || nowMs()) - m.start) / MIN;
    if (el < 0) return { phase: 'pre' };
    if (el >= L.len) return { phase: 'end', clock: m.lg === 'soccer' ? 90 : 9.99 };
    if (m.lg === 'soccer') {
      if (el < 20) return { phase: 'live', clock: Math.max(1, Math.floor(el / 20 * 45)), label: Math.max(1, Math.floor(el / 20 * 45)) + "'" };
      if (el < 25) return { phase: 'live', clock: 45, label: '하프타임', ht: true };
      return { phase: 'live', clock: 45 + Math.floor((el - 25) / 20 * 45), label: (45 + Math.max(1, Math.floor((el - 25) / 20 * 45))) + "'" };
    }
    var inn = el / L.len * 9;
    return { phase: 'live', clock: inn, label: (Math.floor(inn) + 1) + '회 ' + (inn % 1 < 0.5 ? '초' : '말') };
  }
  function scoreOf(m, st) {
    var ev = events(m), s = [0, 0];
    ev.forEach(function (e) {
      if (st.phase === 'pre') return;
      if (m.lg === 'soccer') { if (e.kind === 'goal' && (st.phase === 'end' || e.min <= st.clock)) s[e.side]++; }
      else if (st.phase === 'end' || e.inn - 1 + (e.side ? 0.5 : 0) + 0.25 <= st.clock) s[e.side] += e.runs;
    });
    return s;
  }
  function statsOf(m) {
    var r = function (k) { return rnd(m.id + k); }, poss = 38 + Math.round(r('pos') * 24);
    return m.lg === 'soccer' ? [['점유율', poss, 100 - poss, '%'], ['슈팅', 6 + Math.round(r('s1') * 12), 5 + Math.round(r('s2') * 11), ''], ['유효 슈팅', 2 + Math.round(r('o1') * 6), 1 + Math.round(r('o2') * 6), ''], ['코너킥', 2 + Math.round(r('c1') * 7), 1 + Math.round(r('c2') * 7), '']]
      : [['안타', 5 + Math.round(r('h1') * 9), 4 + Math.round(r('h2') * 9), ''], ['홈런', Math.round(r('hr1') * 3), Math.round(r('hr2') * 3), ''], ['볼넷', 1 + Math.round(r('b1') * 5), 1 + Math.round(r('b2') * 5), ''], ['실책', Math.round(r('e1') * 2), Math.round(r('e2') * 2), '']];
  }
  function standings(lg) {
    var tab = {};
    LEAGUES[lg].teams.forEach(function (t) { tab[t[0]] = { id: t[0], p: 0, w: 0, d: 0, l: 0, pts: Math.round(rnd(lg + t[0] + 'base') * 14) + 10, gf: 0, ga: 0 }; });
    for (var o = -14; o <= 0; o++) matchesOn(lg, o).forEach(function (m) {
      var st = stateOf(m); if (st.phase !== 'end') return;
      var s = scoreOf(m, st), a = tab[m.home], b = tab[m.away];
      a.p++; b.p++; a.gf += s[0]; a.ga += s[1]; b.gf += s[1]; b.ga += s[0];
      if (s[0] > s[1]) { a.w++; b.l++; a.pts += 3; } else if (s[0] < s[1]) { b.w++; a.l++; b.pts += 3; } else { a.d++; b.d++; a.pts++; b.pts++; }
    });
    return Object.keys(tab).map(function (k) { return tab[k]; }).sort(function (a, b) { return b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga); });
  }
  function headline(m) {

    var vg = x.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)'); x.fillStyle = vg; x.fillRect(0, 0, W, H);
    $('vbug').innerHTML = '<span>' + HT.name + '</span><span class="sc">' + s[0] + ' - ' + s[1] + '</span><span>' + AT.name + '</span>' + (clock ? '<span class="tm">' + clock + '</span>' : '');
    $('vcap').textContent = cap; $('vcap').style.opacity = cap ? 1 : 0;
  }

  // ---------- an article ----------
  function openArticle(n) {
    view = 'article'; $('article').hidden = false;
    $('art').innerHTML = '<div class="k">' + esc(n.lg) + ' · Cove 스포츠</div><h2>' + esc(n.t) + '</h2><p>' + esc(n.b) + '</p>' +
      '<p class="src">가상 리그의 기사예요. 경기 화면은 경기 목록에서 OK를 눌러 볼 수 있어요. · OK/뒤로 닫기</p>';
  }
  function closeArticle() { $('article').hidden = true; view = det ? 'detail' : 'home'; if (view === 'home') render(); else renderDetail(); }

  CoveApp.onInit(function (profile, d, ex) {
    who = profile || {}; data = d && typeof d === 'object' ? d : {};
    shift = ex && ex.env && ex.env.shift || 0;
    var it = ex && ex.intent || {};
    // start on the league asked for, or the one that has a live game now
    if (it.lg) lg = it.lg; else if (!matchesOn('soccer', 0).some(function (m) { return stateOf(m).phase === 'live'; }) && matchesOn('baseball', 0).some(function (m) { return stateOf(m).phase === 'live'; })) lg = 'baseball';
    var ms = matchesOn(lg, 0), live = 0;
    ms.forEach(function (m, i) { var p = stateOf(m).phase; if (p === 'live') live = i; });
    sel = live || Math.max(0, ms.findIndex(function (m) { return stateOf(m).phase !== 'end'; }));
    render();
    if (it.live && ms[live] && stateOf(ms[live]).phase === 'live') { openDetail(ms[live]); openVideo(ms[live], true); }
  });
  CoveApp.onEnv(function (env) { shift = env.shift || 0; });
  setInterval(function () { if (view === 'home') render(); else if (view === 'detail') renderDetail(); }, 5000);
  CoveApp.onKey(function (k) {
    if (view === 'video') { if (k === 'back' || k === 'ok') closeVideo(); return; }
    if (view === 'article') { if (k === 'back' || k === 'ok') closeArticle(); return; }
    if (view === 'detail') { detailKey(k); return; }
    homeKey(k);
  });
})();
</script>
