name: Build Cove APK

on:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "keystore/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Cove.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cove-apk
          path: Cove.apk

      # Keeps one always-current download link: Releases > "Cove latest build" > Cove.apk
      - name: Publish latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cove-latest --yes --cleanup-tag || true
          gh release create cove-latest Cove.apk \
            --title "Cove latest build" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install on an Android TV / Google TV by sideloading Cove.apk." \
            --target "${GITHUB_SHA}" \
            --prerelease
